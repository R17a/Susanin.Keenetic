name: Release binaries

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: mipsel
            cc: mipsel-linux-gnu-gcc
            pkg: gcc-mipsel-linux-gnu
            dev: libc6-dev-mipsel-cross
          - arch: mips
            cc: mips-linux-gnu-gcc
            pkg: gcc-mips-linux-gnu
            dev: libc6-dev-mips-cross
          - arch: aarch64
            cc: aarch64-linux-gnu-gcc
            pkg: gcc-aarch64-linux-gnu
            dev: libc6-dev-arm64-cross
          - arch: armv7
            cc: arm-linux-gnueabihf-gcc
            pkg: gcc-arm-linux-gnueabihf
            dev: libc6-dev-armhf-cross
          - arch: x86_64
            cc: gcc
            pkg: gcc-multilib
            dev: ""
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends make file \
            ${{ matrix.pkg }} ${{ matrix.dev }}
      - name: Build ${{ matrix.arch }}
        run: |
          make clean || true
          make CC=${{ matrix.cc }} \
            CFLAGS="-O2 -std=c11 -Wall -Wextra -Wpedantic -static" \
            LDFLAGS="-static"
          file susanin-agent
      - name: Stage deploy archive
        run: |
          set -e
          STAGE="pkg-${{ matrix.arch }}"
          mkdir -p "$STAGE"
          cp susanin-agent "$STAGE/susanin-agent"
          for f in datapath.sh susanin.sh update.sh uninstall.sh install.sh \
                   config.example.conf vpn_always.txt vpn_never.txt S94susanin \
                   DEPLOY.md; do
            [ -f "tools/$f" ] && cp "tools/$f" "$STAGE/$f" || true
            [ -f "$f" ] && cp "$f" "$STAGE/$f" || true
          done
          tar -czf "susanin-keenetic-deploy-${{ matrix.arch }}.tar.gz" -C "$STAGE" .
          ls -l "susanin-keenetic-deploy-${{ matrix.arch }}.tar.gz"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.arch }}
          path: susanin-keenetic-deploy-${{ matrix.arch }}.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          body: |
            Susanin.Keenetic ${{ github.ref_name }}

            ### Установка (первый раз)
            ```sh
            opkg update && opkg install ca-certificates
            wget -qO- https://raw.githubusercontent.com/R17a/Susanin.Keenetic/main/install.sh | sh
            ```
            Установщик скачивает готовый архив под вашу архитектуру, определяет
            LAN/VPN и (при наличии) OpenConnect, запрашивает подтверждение и
            запускает демон. Существующие `susanin.conf`, `vpn_always.txt`,
            `vpn_never.txt` и кэш сохраняются.

            ### Обновление
            ```sh
            /opt/susanin/bin/susanin-agent version
            sh /opt/susanin/tools/susanin.sh update
            sh /opt/susanin/tools/susanin.sh update ${{ github.ref_name }}
            /opt/susanin/bin/susanin-agent version
            ```
            `update` печатает `installed → target`, делает бэкап `susanin.conf`
            и `susanin.state` в `/opt/susanin/var/backup/`, заменяет бинарь и
            скрипты, **не трогая** `etc/` и `var/`, затем перезапускает демон.

            ### Удаление
            ```sh
            sh /opt/susanin/tools/susanin.sh uninstall
            sh /opt/susanin/tools/susanin.sh uninstall --purge
            ```

            ### Что нового в этой версии
            - сайты, ответившие по основному каналу, больше не переводятся в VPN
              (кандидатами остаются только направления без ответа);
            - новый список «всегда напрямую»: `/opt/susanin/etc/vpn_never.txt`
              (домен / IPv4 / CIDR) — адреса не попадают в `ok`/`test` и всегда
              идут напрямую;
            - `sh /opt/susanin/tools/susanin.sh forget <ip>` — убрать адрес из
              кэша и наборов;
            - установщик находит OpenConnect-сервер (ocserv, `oc0`) и предлагает
              добавить его подсеть в маршрутизацию Susanin;
            - `vpn_always.txt` / `vpn_never.txt` при install/update не
              перезаписываются.

            ### Сборки
            - архивы: `susanin-keenetic-deploy-mipsel.tar.gz`, `…-mips.tar.gz`,
              `…-aarch64.tar.gz`, `…-armv7.tar.gz`, `…-x86_64.tar.gz` и
              `SHA256SUMS`;
            - контейнер: `ghcr.io/r17a/susanin.keenetic:${{ github.ref_name }}`
              (+`latest`).

            **Проверено**: mipsel — Keenetic Viva, KeeneticOS 5.1.4–5.1.5,
            Entware (+ клиент OpenConnect). Остальные архитектуры уже собраны и
            приложены готовыми архивами, но на живом железе не тестировались —
            сообщайте об ошибках в Issues.
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
