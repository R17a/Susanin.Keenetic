# Susanin.Keenetic runtime configuration.
# Non-secret. Normally generated by `susanin setup` / install.sh.

# Egress (VPN/WireGuard tunnel) interface(s) and tunnel IPv4 address(es).
# Несколько — через запятую: включается фейловер (активен один egress, при
# падении переключаемся на следующий живой). Адреса выравниваются по индексу
# с интерфейсами (по адресу берётся source для health-проб каждого egress).
#   egress_interface=nwg0,nwg1
#   egress_address=10.8.1.1,10.8.1.2
egress_interface=nwg0
egress_address=10.8.1.1

# LAN ingress interfaces and their networks (comma-separated).
lan_interfaces=br0,br1
lan_subnets=192.168.1.0/24,10.1.30.0/24

# Routing: numeric table for VPN egress and fwmark values (32-bit).
routing_table=100
mark_test=0x10000000
mark_ok=0x20000000
mark_mask=0x30000000
ip_rule_priority_start=2000

# Polling intervals.
fast_interval=1s
soft_interval=1s
judge_interval=1s
health_interval=5s
# FAST TCP-SYN: сколько SYN без ответа нужно для детекта (1 = быстрее, больше ложных)
fast_syn_min_op=2

# Порты, для которых отключено БЫСТРОЕ автообучение (детект «одиночный SYN без
# ответа») — именно так выглядит скан-шум. Это не даёт забивать ok-кэш
# (22/23/445/554 и т.п.). «Мягкое» обучение (потоки с ответами, которые затем
# тормозят/стопорятся) по этим портам продолжает работать, веб (80/443/QUIC) —
# как обычно. Если сервис на таком порту блокируется полностью (нет ответа),
# добавьте его домен/IP/CIDR в vpn_always.txt (списки не зависят от порта) или
# уберите порт из этого списка.
learn_exclude_ports=22,23,53,135,137,138,139,445,554,1433,1723,3306,3389,5432,5900,6379,7547,9100,11211,27017

# Интерфейсы, которые НИКОГДА не берём как egress или LAN. Нужно для соседства
# с qWDTT_Server_Keenetic (серверные туннели wdtt0/wdttraw0) и подобными: иначе
# их можно случайно затащить в lan_interfaces и начать обрабатывать клиентов
# чужого туннеля (двойной туннель). Список через запятую.
discover_exclude=wdtt0,wdttraw0,tun0,tap0

# Cache TTLs. ok_ttl=0 means "never expire" (permanent cache; still self-corrects:
# a confirmed IP that stops replying via VPN is removed by JUDGE automatically).
ok_ttl=0
ok_refresh_below=3h
# Bounded GC (like upstream Susanin.Keenetic v0.12): per-proto ok-cache limit, 0=off.
ok_max_entries=4096
# Гистерезис снятия из ok: сколько ПОДРЯД «сбоев» по адресу нужно, чтобы убрать
# его из VPN-кэша. Больше — меньше «мельтешения» (OK-CHURN), но медленнее
# реакция на реально умерший маршрут. 1 = снимать сразу (как раньше).
ok_evict_misses=3
test_ttl=1m
cooldown_ttl=5m
cooldown_ok_ttl=30s
watch_ttl=8s
watch_retry_below=4s

# Health probe targets and source address (through tunnel).
health_probe=1.1.1.1,8.8.8.8
health_probe_src=10.8.1.1
# Miss-debounce: сколько подряд неудачных проб подряд = туннель DOWN (5s x 4 = 20s).
health_miss_debounce=4
# Тип health-пробы: icmp (по умолчанию) или tcp. Для egress, который не несёт
# ICMP (VLESS/XRay через TUN), укажите tcp — иначе туннель будет считаться
# «мёртвым» и Susanin.Keenetic уйдёт в DIRECT. health_tcp_port — порт пробы (443).
health_mode=icmp
health_tcp_port=443

# Домены, которые ВСЕГДА идут через VPN (список-«принудительный»).
# Файл: по одному домену (или IPv4) на строку, '#' — комментарии. Демон
# резолвит A-записи и пиннит их IP в ok-наборы (TCP и UDP), обновляет каждые
# vpn_always_interval секунд. Изменение файла подхватывается на лету.
# Если файла нет — функция выключена. Готовый список поставляется с дистрибутивом
# (vpn_always.txt); при установке/обновлении существующий файл НЕ перезаписывается,
# но может дополняться новыми записями из сборки (merge; существующие не удаляются).
# Поддерживаются wildcard-строки: *.example.com — домен и все поддомены.
vpn_always_file=/opt/susanin/etc/vpn_always.txt
vpn_always_interval=300s
# Резолвер для списка. Пусто (по умолчанию) = автоматически: первый
# nameserver из /etc/resolv.conf; если там пусто или 127.0.0.1 (NDM) —
# берётся IPv4-адрес LAN-моста (напр. 192.168.1.1).
# Можно задать свой резолвер (только голый IPv4, напр. 8.8.8.8)
# используемый и для vpn_always, и для vpn_never. Запросы идут с самого
# роутера (OUTPUT) напрямую, Susanin.Keenetic их не метит; в РФ публичные 8.8.8.8/
# 1.1.1.1 на :53 часто недоступны/подменяются — тогда домены не зарезолвятся
# и список не закрепится. Надёжнее оставить пусто (резолвер роутера).
vpn_always_dns=

# Список «всегда напрямую» (никогда через VPN): домен / IPv4 / CIDR.
# Нет файла = выключено. Существующий файл при install/update не перезаписывается,
# но может дополняться новыми записями из сборки (merge; существующие не удаляются).
vpn_never_file=/opt/susanin/etc/vpn_never.txt
vpn_never_interval=300s

# Diagnostics.
# log_level — уровень логов Susanin.Keenetic (quiet|error|warn|info|debug|trace).
log_level=info
diagnostics=off
# xray_loglevel — ОТДЕЛЬНЫЙ уровень логов Xray (debug|info|warning|none).
# В боевом режиме держите warning/none: при info Xray пишет строку на каждое
# соединение ("from … accepted …") и лог быстро растёт. Применяется к
# /opt/susanin/etc/xray-tproxy.json при `xray-egress.sh enable|run`
# (Xray читает уровень только при старте, поэтому Xray перезапускается).
xray_loglevel=warning

# Режим работы с носителем.
#   normal — обычный: ведём лог-файл, сохраняем состояние (раз в 5 минут),
#            делаем бэкапы/архивы.
#   soft   — минимум записей на диск (для установки Entware во внутреннюю
#            память роутера): лог в файл не пишем, бэкапы/архивы не делаем,
#            состояние сохраняем редко — раз в soft_state_interval.
# Установщик выставляет автоматически по типу носителя (/opt): flash → normal,
# внутренняя память (NAND/UBIFS/overlay) → soft.
disk_mode=normal
# Как часто сохранять состояние в режиме soft (по умолчанию 12h; 0 = никогда).
soft_state_interval=12h

# Встроенная веб-панель (мини-HTTP в самом агенте; запуск: `susanin-agent web`).
# По умолчанию ВЫКЛЮЧЕНА. Слушает только LAN-адрес (не 0.0.0.0), порт по
# умолчанию 8087. web_token — токен доступа (?token=... или заголовок
# X-Auth-Token); пустое значение = вход без пароля, поэтому не рекомендуется.
# Статика отдаётся из /opt/susanin/www, данные — из /api/status.
# Для работы Web используйте отдельный сервис (см. init/S95susanin-web).
#
# Пример открытия в браузере (адрес = web_listen:web_port):
#   http://192.168.1.1:8087/?token=ВАШ_ТОКЕН
#   если web_token пуст:  http://192.168.1.1:8087/
# Быстрая проверка с роутера:
#   curl -s "http://127.0.0.1:8087/api/status?token=ВАШ_ТОКЕН" | head -c 200
web_enable=0
web_listen=192.168.1.1
web_port=8087
web_token=

# Тип egress: interface (nwg*/wdtt*/tun*) | tproxy.
# Для XRay/REALITY используется режим tproxy (без TUN/tun2socks): Susanin.Keenetic
# помечает пакеты (mangle), а в nat PREROUTING они REDIRECT-ятся в локальный
# Xray (dokodemo-door, followRedirect), который гонит их в Reality.
# Покрывается TCP (сайты). Работает на Keenetic MIPS с Xray 1.8.24.
#   egress_type=tproxy
#   tproxy_port=12345
# Xray запускается конфигом /opt/susanin/etc/xray-tproxy.json
# (шаблон — xray-tproxy.json.example; сервис — init S93xray-tproxy).
# egress_interface в этом режиме не используется.
egress_type=interface
# Порт локального Xray (dokodemo-door redirect) для egress_type=tproxy.
tproxy_port=12345

# --- UDP-релей (egress через XRay, для игр/звонков/QUIC) -------------------
# UDP-релей исполняется самим демоном: помеченный UDP заворачивается через
# TPROXY на udp_relay_port, демон узнаёт исходный адрес и отправляет датаграммы
# в локальный Xray-socks (udp:true) по SOCKS5 UDP ASSOCIATE.
#
# Зачем выключен по умолчанию: релей нужен ТОЛЬКО для egress_type=tproxy (XRay).
# В обычном режиме (egress_type=interface, VPN из «Других подключений») UDP идёт
# через VPN так же, как TCP (по метке и таблице) — релей не нужен и не
# запускается. Требуется лишь Xray socks с udp:true; порт udp_relay_port (1081)
# должен быть свободен.
# Включается автоматически: `xray-egress.sh enable` или `... run <ip> both`
# (или вручную udp_relay=1).
#   udp_relay=1            # по умолчанию 0 (выключено)
#   udp_relay_port=1081    # локальный порт TPROXY-приёма
#   socks_addr=127.0.0.1   # локальный Xray socks
#   socks_port=1080
udp_relay=0
udp_relay_port=1081
socks_addr=127.0.0.1
socks_port=1080

# --- Профили маршрутизации (P1, экспериментально) --------------------------
# Профиль = свой список (домены / IP / CIDR) -> свой туннель, с отдельными
# меткой и таблицей маршрутизации. Пример: тяжёлый CDN гнать в отдельный
# туннель, остальное — как обычно. Профилей до 4; задаются повторяющимися
# ключами с индексом 1..4: profile1_*, profile2_*, ... Профиль ВКЛЮЧАЕТСЯ,
# только если задан profileN_name; остальное для него опционально:
#   profileN_name    — имя (включает профиль), [a-z0-9_]
#   profileN_egress  — интерфейс туннеля, куда гнать список
#   profileN_list    — файл списка (/opt/susanin/etc/profiles/<имя>.txt)
#   profileN_table   — таблица маршрутизации (по умолчанию 201..204)
#   profileN_mark    — fwmark (по умолчанию 0x40000000,0x08000000,0x04000000,0x02000000)
# Управление: sh /opt/susanin/tools/profiles.sh {up|down|status}
# Если ни одного profileN_name нет — профилей нет, поведение не меняется.
# Адрес обрабатывается ПЕРВЫМ совпавшим профилем (правила идут по порядку).
#
# Пример на два профиля (разные списки -> разные туннели):
#   profile1_name=cdn
#   profile1_egress=nwg1
#   profile1_list=/opt/susanin/etc/profiles/cdn.txt
#   profile2_name=social
#   profile2_egress=nwg2
#   profile2_list=/opt/susanin/etc/profiles/social.txt
#
# Только если table/mark уже заняты — задайте их явно, например:
#   profile1_table=201
#   profile1_mark=0x40000000

# --- LAN-серверные туннели (qWDTT и т.п.) и период сверки датаплейна --------
# lan_server_interfaces — туннели-СЕРВЕРЫ (например, qWDTT wdtt0/wdttraw0),
# клиенты которых должны, наоборот, обрабатываться Susanin: интерфейс и его
# IPv4-сеть добавляются к lan_interfaces/lan_subnets при discover/rescan.
# Раньше это делали руками правкой lan_interfaces/lan_subnets.
# Пусто (по умолчанию) — как раньше. Формат — имена через запятую.
#   lan_server_interfaces=wdtt0,wdttraw0
lan_server_interfaces=

# dp_check_interval — период сверки датаплейна (reconcile), сек. Меньше — быстрее
# заметим снос правил NDM (для tproxy это и есть «частая проверка правил»).
# 0 = 15 c. По умолчанию 15.
dp_check_interval=15s

# --- Важно про ok_ttl ------------------------------------------------------
# ok_ttl=0 ОТКЛЮЧАЕТ истечение выученных адресов: они «залипают» в VPN навсегда,
# набор susanin_ok_* растёт, и всё больше незнакомых адресов (особенно CDN /
# Cloudflare) уходит в туннель. Рекомендуется конечный TTL (по умолчанию 6h).
#   ok_ttl=21600

# --- Автообучение: пороги (L1–L6) ------------------------------------------
# Пороги против ложных заворотов. Увеличивайте, если в VPN уходит лишнее.
#   learn_min_op=10         # мин. пакетов к адресу для обучения (FAST/SOFT)
#   learn_min_bytes=2000    # мин. байт «от нас»
#   confirm_min_bytes=512   # мин. ответных байт для подтверждения (judge)
#   learn_strict=0          # 1 = удвоить пороги (ещё строже)
learn_min_op=10
learn_min_bytes=2000
confirm_min_bytes=512
learn_strict=0

# --- CDN-универсал (C1/C2): агрегация по префиксу --------------------------
# Зачем: блокируемые сайты за CDN (Cloudflare) меняют edge-адреса; вручную их
# не перечислить. Если подтверждённый (CONFIRMED) адрес оказался из диапазона
# CDN — в susanin_ok_net добавляется ближайший префикс (не шире cdn_prefix_max)
# на cdn_prefix_ttl. Следующие edge-и идут в VPN сразу.
# Список диапазонов обновляется с cdn_ranges_url (wget/curl, раз в сутки); без
# сети используется последний успешный файл.
#   cdn_prefix_learn=1      # 0 = выключить агрегацию
#   cdn_prefix_max=24       # не агрегировать шире /24 (ограничивает «радиус»)
#   cdn_prefix_ttl=3600
#   cdn_ranges_interval=86400   # 0 = не обновлять автоматически
cdn_ranges_file=/opt/susanin/etc/cdn_ranges.txt
cdn_ranges_url=https://www.cloudflare.com/ips-v4
cdn_ranges_interval=86400
cdn_prefix_learn=1
cdn_prefix_ttl=3600
cdn_prefix_max=24

# --- C3: IPv6-политика -----------------------------------------------------
# Susanin работает только по IPv4. Если у клиентов есть IPv6-интернет, часть
# трафика (у CDN часто есть AAAA) идёт мимо. ipv6_block=1 блокирует IPv6 из LAN,
# чтобы клиенты уходили на IPv4 (грубо, но надёжно). 0 = не трогать.
ipv6_block=0


